# cargo-deny configuration: licences, advisories, duplicate crates and sources.
# Run `cargo deny check` (CI runs it on every push and pull request).

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
all-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "deny"
# Each entry is reviewed; remove it when upstream ships a fix.
ignore = [
    # rsa: Marvin timing side channel in RSA private-key operations. No fixed release
    # exists. Ruxt only performs RSA private-key operations when the user authenticates with
    # an RSA key file, locally, and an attacker would need precise timing of those signatures.
    # Mitigation: prefer Ed25519 keys (the key generator only makes Ed25519).
    { id = "RUSTSEC-2023-0071", reason = "no fix upstream; RSA user-key signing only, local timing" },
    # ttf-parser: unmaintained. Used directly for font-name parsing and transitively by egui
    # (ab_glyph). Only parses fonts installed on the user's machine, never remote data.
    { id = "RUSTSEC-2026-0192", reason = "egui depends on it too; parses local system fonts only" },
    # zbus family: unmaintained as standalone crates, pulled in by rfd/arboard on Linux for
    # the file dialog and clipboard over D-Bus. Linux desktop plumbing, not network input.
    { id = "RUSTSEC-2026-0370", reason = "zvariant via rfd/arboard (Linux D-Bus); no fix upstream" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via rfd/arboard (Linux D-Bus); no fix upstream" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via rfd/arboard (Linux D-Bus); no fix upstream" },
]

[licenses]
version = 2
# Permissive licences only; anything copyleft or unknown fails the check.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "OpenSSL",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unlicense",
    "0BSD",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = [
    # Plaintext-at-rest or network crates that must never sneak in unnoticed.
    { name = "openssl" },
    { name = "native-tls" },
    { name = "reqwest" },
    { name = "ureq" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
