[package]
name = "ruxt-inputguard"
version = "0.1.0"
edition = "2021"
description = "Ruxt agent guard: drops injected keyboard/mouse input aimed at this process's windows (Windows low-level hooks)"
license = "MIT OR Apache-2.0"
publish = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_LibraryLoader"] }
